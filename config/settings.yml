repository:                       # the central SQL Server monitoring database
  name: PRD-DBA-REPO              # instance that hosts DBA_Monitoring (NOT one of the monitored boxes)
  host: prd-dba-repo.corp.local
  port: 1433
  database: DBA_Monitoring
  schema: mon
  auth: windows                   # windows | sql  (windows preferred; else password_ref)
  # username: svc_dba_monitor
  # password_ref: env:REPO_PW
  driver: "ODBC Driver 18 for SQL Server"
  encrypt: true
  trust_server_certificate: true
  connect_timeout_s: 5
  query_timeout_s: 60
  auto_bootstrap: true            # create schema/tables on first run if missing
  bulk:
    fast_executemany: true
    batch_rows: 5000

paths:
  exports: data/exports           # optional cold Parquet archive
  logs: logs

retention:
  raw_days: 7
  runs_days: 30
  deadlock_days: 90
  export_retention_days: 30
  prune_strategy: delete          # delete | partition_switch
  prune_batch_rows: 50000
  rebuild_repo_indexes: weekly    # weekly | never

concurrency:
  max_workers: 8
  per_server_timeout_s: 120

tiers:
  fast_minutes: 15
  daily_time: "06:00"             # local collector time; run off-hours

collection:
  parquet_export: true
  # databases excluded from per-database collectors (index/stats/space/query store)
  exclude_databases: [tempdb, model]
  include_system_databases: false
  query_window_hours: 24
  top_n_queries: 25
  # 'hash' replaces captured statement text with a digest; 'none' keeps text as collected
  statement_text_mode: none       # none | hash

logging:
  level: INFO
  json: false
  max_bytes: 10485760
  backup_count: 7
