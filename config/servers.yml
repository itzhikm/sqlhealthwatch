# Fleet inventory. Onboarding a server = adding a block here + running the provisioning
# script on the instance + `python -m sqlhealthwatch test-conn --server NAME`. No code change.
#
# Every instance below uses SQL authentication with the shared `pyspark_user` login. The password
# is NOT here: `password_ref` names an environment variable, resolved at load time from .env (which
# is gitignored). A literal password in this file is rejected by config validation.
defaults:
  driver: "ODBC Driver 17 for SQL Server"
  encrypt: true
  trust_server_certificate: true   # set false once certs are trusted
  connect_timeout_s: 5
  query_timeout_s: 30
  tags: []

servers:
  - name: PRD-SQL-01
    host: 127.0.0.1
    port: 1433
    auth: sql
    username: pyspark_user
    password_ref: env:SQL_MONITOR_PW
    enabled: true
    tags: [tier1, erp, us-east]
